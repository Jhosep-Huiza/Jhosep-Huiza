<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 140" width="900" height="140" role="img" aria-label="Red de partículas neón animada">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffff"/>
      <stop offset="0.5" stop-color="#ff00ff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
  </defs>
  <rect width="900" height="140" fill="#0a0a0f"/>
  <path d="M60 40L180 95L300 35L420 100L540 40L660 95L780 35L850 100M60 40L300 35L540 40L780 35M180 95L420 100L660 95L850 100" fill="none" stroke="url(#grad)" stroke-width="1.2" stroke-opacity=".55" stroke-dasharray="6 10" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <g filter="url(#glow)">
    <circle cx="60" cy="40" r="4" fill="#00ffff"><animate attributeName="r" values="3;5.5;3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="95" r="4" fill="#ff00ff"><animate attributeName="r" values="3;5.5;3" dur="2s" begin=".25s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="35" r="4" fill="#39ff14"><animate attributeName="r" values="3;5.5;3" dur="2s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="100" r="4" fill="#00ffff"><animate attributeName="r" values="3;5.5;3" dur="2s" begin=".75s" repeatCount="indefinite"/></circle>
    <circle cx="540" cy="40" r="4" fill="#ff00ff"><animate attributeName="r" values="3;5.5;3" dur="2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="95" r="4" fill="#39ff14"><animate attributeName="r" values="3;5.5;3" dur="2s" begin="1.25s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="35" r="4" fill="#00ffff"><animate attributeName="r" values="3;5.5;3" dur="2s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="100" r="4" fill="#ff00ff"><animate attributeName="r" values="3;5.5;3" dur="2s" begin="1.75s" repeatCount="indefinite"/></circle>
  </g>
</svg>
