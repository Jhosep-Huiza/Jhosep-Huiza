<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="900" height="16" role="img" aria-label="Separador neón">
  <defs>
    <filter id="glow" x="-5%" y="-400%" width="110%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0a0a0f" stop-opacity="0"/>
      <stop offset=".2" stop-color="#00ffff"/>
      <stop offset=".5" stop-color="#ff00ff"/>
      <stop offset=".8" stop-color="#39ff14"/>
      <stop offset="1" stop-color="#0a0a0f" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="7" width="900" height="2" fill="url(#g)" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.55;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <circle cy="8" r="3" fill="#ffffff" filter="url(#glow)">
    <animate attributeName="cx" values="0;900" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
